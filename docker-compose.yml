services:
  postgres:
    image: postgres:16-alpine
    container_name: smartpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartpos
      POSTGRES_PASSWORD: smartpos
      POSTGRES_DB: smartpos
    ports:
      - "5432:5432"
    volumes:
      - smartpos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartpos-postgres-data:
